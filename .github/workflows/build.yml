name: build
run-name: build

# Manually dispatched builds for private projects.
# Security model: see README.md. In short: this public repository contains
# only generic build logic. Everything project-specific (source location,
# build recipe path, target ref, return location) lives in secrets of a
# per-project GitHub environment and is never placed in workflow inputs,
# job environment variables, or step output, because Actions prints env
# values into the public log. All tool output that could contain private
# values is redirected to a private log file that is returned through the
# private drop channel only. Public log lines are fixed strings.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Opaque build-environment code for the project"
        required: true
        type: string

permissions: {}

concurrency:
  group: build-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            python: python3
          - os: windows-2022
            platform: windows
            arch: x86_64
            python: python
          - os: macos-15
            platform: macos
            arch: arm64
            python: python3
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.project }}
    timeout-minutes: 180
    env:
      CB_PLATFORM: ${{ matrix.platform }}
      CB_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out this builder repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the project configuration
        shell: python
        env:
          BUILD_CONFIG_JSON: ${{ secrets.BUILD_CONFIG_JSON }}
        run: |
          import json, os, sys
          raw = os.environ.get("BUILD_CONFIG_JSON", "")
          try:
              cfg = json.loads(raw)
              source_ssh = cfg["source_ssh"]
              recipe = cfg["recipe"]
              return_ssh = cfg["return_ssh"]
              ref = cfg["ref"]
              prefix = cfg["branch_prefix"]
              for value in (source_ssh, recipe, return_ssh, ref, prefix):
                  if not isinstance(value, str) or not value or "\n" in value:
                      raise ValueError("bad value")
          except Exception:
              print("Project configuration is not available.")
              sys.exit(1)
          base = os.path.join(os.environ["RUNNER_TEMP"], "cb-config")
          os.makedirs(base, exist_ok=True)
          def put(name, value):
              with open(os.path.join(base, name), "w", encoding="utf-8") as f:
                  f.write(value)
          put("source_ssh", source_ssh)
          put("recipe", recipe)
          put("return_ssh", return_ssh)
          put("ref", ref)
          put("prefix", prefix)
          temp = os.environ["RUNNER_TEMP"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("CB_CFG=" + base + "\n")
              f.write("CB_SRC=" + os.path.join(temp, "cb-src") + "\n")
              f.write("CB_OUT=" + os.path.join(temp, "cb-out") + "\n")
              f.write("CB_LOG=" + os.path.join(temp, "cb-build.log") + "\n")
              f.write("CB_FETCH_OK=0\n")
              f.write("CB_BUILD_OK=0\n")
              f.write("CB_RETURN_OK=0\n")
          print("Project configuration loaded.")

      - name: Fetch the private source
        shell: bash
        env:
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
        run: |
          if [ -z "${SOURCE_SSH_KEY}" ]; then
            echo "Source credential is not configured."
            exit 1
          fi
          if [ ! -f "${CB_CFG}/source_ssh" ]; then
            echo "Project configuration is missing."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SOURCE_SSH_KEY}" > ~/.ssh/source_key
          chmod 600 ~/.ssh/source_key
          trap 'rm -f ~/.ssh/source_key' EXIT
          source_ssh="$(cat "${CB_CFG}/source_ssh")"
          ref="$(cat "${CB_CFG}/ref")"
          : > "${CB_LOG}"
          echo "ref: ${ref}" >> "${CB_LOG}"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>>"${CB_LOG}"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/source_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          export GIT_TERMINAL_PROMPT=0
          if ! git clone --quiet --branch "${ref}" "${source_ssh}" "${CB_SRC}" >>"${CB_LOG}" 2>&1; then
            echo "Fetching the source failed. Details were withheld from this public log."
            exit 1
          fi
          actual="$(git -C "${CB_SRC}" rev-parse HEAD 2>>"${CB_LOG}")"
          echo "sha: ${actual}" >> "${CB_LOG}"
          rm -f ~/.ssh/source_key
          trap - EXIT
          echo "CB_FETCH_OK=1" >> "${GITHUB_ENV}"
          echo "Source fetched."

      - name: Run the private build recipe (output withheld)
        shell: bash
        if: ${{ env.CB_FETCH_OK == '1' }}
        run: |
          mkdir -p "${CB_OUT}"
          recipe="$(cat "${CB_CFG}/recipe")"
          cd "${CB_SRC}"
          if ${{ matrix.python }} "${recipe}" --platform "${CB_PLATFORM}" --arch "${CB_ARCH}" --out "${CB_OUT}" >> "${CB_LOG}" 2>&1; then
            echo "CB_BUILD_OK=1" >> "${GITHUB_ENV}"
            echo "Build finished."
          else
            echo "Build failed. The build log was withheld from this public log and returned privately."
          fi

      - name: Return results to the private drop repository
        shell: bash
        if: always()
        env:
          RETURN_SSH_KEY: ${{ secrets.RETURN_SSH_KEY }}
        run: |
          if [ ! -f "${CB_CFG}/return_ssh" ]; then
            echo "Nothing to return."
            exit 0
          fi
          if [ -z "${RETURN_SSH_KEY}" ]; then
            echo "Return credential is not configured."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${RETURN_SSH_KEY}" > ~/.ssh/return_key
          chmod 600 ~/.ssh/return_key
          trap 'rm -f ~/.ssh/return_key' EXIT
          return_ssh="$(cat "${CB_CFG}/return_ssh")"
          prefix="$(cat "${CB_CFG}/prefix")"
          rlog="${RUNNER_TEMP}/cb-return.log"
          : > "${rlog}"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>>"${rlog}"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/return_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          export GIT_TERMINAL_PROMPT=0
          ret="${RUNNER_TEMP}/cb-return"
          mkdir -p "${ret}"
          cd "${ret}"
          git init --quiet . >>"${rlog}" 2>&1
          git config user.name "common-builder"
          git config user.email "46545607+mouseos@users.noreply.github.com"
          if [ "${CB_BUILD_OK:-0}" = "1" ]; then
            # GitHub rejects files over 100 MB in a push, and the packages
            # are larger than that, so big zips are split into ~90 MB
            # parts (zip.partaa, zip.partab, ...). Reassemble with
            # `cat zip.part* > zip` after collecting the branch.
            for z in "${CB_OUT}"/*.zip; do
              [ -e "$z" ] || continue
              size=$(stat -c%s "$z" 2>/dev/null || stat -f%z "$z")
              if [ "$size" -gt 95000000 ]; then
                split -b 90000000 "$z" "$(basename "$z").part" >>"${rlog}" 2>&1
              else
                cp "$z" . >>"${rlog}" 2>&1
              fi
            done
          fi
          if [ -f "${CB_LOG:-}" ]; then
            cp "${CB_LOG}" build.log
          fi
          git add -A >>"${rlog}" 2>&1
          if git diff --cached --quiet; then
            echo "Nothing to return."
            rm -f ~/.ssh/return_key
            trap - EXIT
            echo "CB_RETURN_OK=1" >> "${GITHUB_ENV}"
            exit 0
          fi
          git commit --quiet -m "common-builder output" >>"${rlog}" 2>&1
          branch="${prefix}/${{ github.run_id }}-${CB_PLATFORM}"
          if ! git push --quiet "${return_ssh}" "HEAD:refs/heads/${branch}" >>"${rlog}" 2>&1; then
            echo "Returning the results failed. Details were withheld from this public log."
            exit 1
          fi
          rm -f ~/.ssh/return_key
          trap - EXIT
          echo "CB_RETURN_OK=1" >> "${GITHUB_ENV}"
          echo "Results returned."

      - name: Verdict
        shell: bash
        if: always()
        run: |
          if [ "${CB_FETCH_OK:-0}" != "1" ]; then
            echo "Fetching the source did not succeed."
            exit 1
          fi
          if [ "${CB_RETURN_OK:-0}" != "1" ]; then
            echo "Returning the results failed."
            exit 1
          fi
          if [ "${CB_BUILD_OK:-0}" != "1" ]; then
            echo "Build failed. Details were withheld from this public log and returned privately."
            exit 1
          fi
          echo "Build succeeded."

      - name: Clean up
        shell: bash
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/cb-src" "${RUNNER_TEMP}/cb-out" "${RUNNER_TEMP}/cb-return" "${RUNNER_TEMP}/cb-config" "${RUNNER_TEMP}/cb-build.log" "${RUNNER_TEMP}/cb-return.log" ~/.ssh/source_key ~/.ssh/return_key
          echo "Cleaned up."
