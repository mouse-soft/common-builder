name: test-nokey

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Try reading the private source with no configured key
        shell: bash
        env:
          GH_TOKEN_AUTO: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target="mouse-soft/obs-weather-plus"
          if git ls-remote "https://github.com/${target}.git" HEAD >/dev/null 2>&1; then
            echo "TEST1 anonymous HTTPS: READABLE"
          else
            echo "TEST1 anonymous HTTPS: NOT readable"
          fi
          if git -c http.extraHeader="Authorization: Bearer ${GH_TOKEN_AUTO}" ls-remote "https://github.com/${target}.git" HEAD >/dev/null 2>&1; then
            echo "TEST2 automatic GITHUB_TOKEN: READABLE"
          else
            echo "TEST2 automatic GITHUB_TOKEN: NOT readable"
          fi
          if GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new" git ls-remote "git@github.com:${target}.git" HEAD >/dev/null 2>&1; then
            echo "TEST3 SSH without any key: READABLE"
          else
            echo "TEST3 SSH without any key: NOT readable"
          fi
